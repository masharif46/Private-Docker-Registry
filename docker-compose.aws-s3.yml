# Amazon S3 storage override. The bucket must already exist.
services:
  registry:
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_ACCESSKEY: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      REGISTRY_STORAGE_S3_SECRETKEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      REGISTRY_STORAGE_S3_REGION: ${AWS_REGION:?Set AWS_REGION}
      REGISTRY_STORAGE_S3_BUCKET: ${AWS_S3_BUCKET:?Set AWS_S3_BUCKET}
      REGISTRY_STORAGE_S3_SECURE: "true"
      REGISTRY_STORAGE_S3_V4AUTH: "true"
      REGISTRY_STORAGE_S3_ENCRYPT: ${AWS_S3_ENCRYPT:-true}
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${S3_ROOT_DIRECTORY:-/registry}
