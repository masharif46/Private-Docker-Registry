# Akamai/Linode Object Storage override. The bucket must already exist.
services:
  registry:
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_ACCESSKEY: ${LINODE_S3_ACCESS_KEY:?Set LINODE_S3_ACCESS_KEY}
      REGISTRY_STORAGE_S3_SECRETKEY: ${LINODE_S3_SECRET_KEY:?Set LINODE_S3_SECRET_KEY}
      REGISTRY_STORAGE_S3_REGION: ${LINODE_S3_REGION:?Set LINODE_S3_REGION}
      REGISTRY_STORAGE_S3_BUCKET: ${LINODE_S3_BUCKET:?Set LINODE_S3_BUCKET}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${LINODE_S3_ENDPOINT:?Set full LINODE_S3_ENDPOINT URL}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: "true"
      REGISTRY_STORAGE_S3_SECURE: "true"
      REGISTRY_STORAGE_S3_V4AUTH: "true"
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${S3_ROOT_DIRECTORY:-/registry}
